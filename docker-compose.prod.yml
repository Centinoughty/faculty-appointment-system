services:
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    image: famsnitc/fams-admin:${APP_VERSION:-latest}
    container_name: fams-admin
    env_file:
      - .env
    ports:
      - "8000:3000"
    depends_on:
      - server
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    image: famsnitc/fams-client:${APP_VERSION:-latest}
    container_name: fams-client
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - app-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: famsnitc/fams-server:${APP_VERSION:-latest}
    container_name: fams-server
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: fams-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fams}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - famsgres:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  famsgres:
    name: famsgres

networks:
  app-network:
    name: fams-net
    driver: bridge